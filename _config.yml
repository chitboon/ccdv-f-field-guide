title: CCDV-F Field Guide
description: >-
  Unofficial study guide for the Claude Certified Developer – Foundations
  (CCDV-F) exam by Anthropic. 423 practice items, two blueprint-exact
  53-item mock exams, domain drills, trap patterns, and per-domain mental
  models. Covers the API, agents, tools and MCP, prompt and context
  engineering, model selection, security, evals, and Claude Code.
